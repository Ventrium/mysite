<!doctypehtml><title>Multiple ILs Time Calculator</title><h1>Multiple ILs Time Calculator</h1><div id=times><input type=number step=any></div><br><button onclick=add()>Add</button><br><br><input type=number id=fps min=1 value=240> <button onclick=calculate()>Calculate</button><p id=result></p><script>function add(){let e=document.createElement("input");e.type="number",e.step="any",document.getElementById("times").appendChild(document.createElement("br")),document.getElementById("times").appendChild(e)}function calculate(){let t=Number(document.getElementById("fps").value),e=[...document.querySelectorAll("#times input")].map(e=>Number(e.value)).filter(e=>!isNaN(e));var n=e.map(e=>Math.round(e*t)/t).reduce((e,t)=>e+t,0),l=Math.floor(1e3*n)/1e3,r=Math.round(1e3*n)/1e3,n=(.498<=1e3*n%1?Math.ceil(1e3*n):Math.floor(1e3*n))/1e3;function u(e){return Math.floor(e/60)+":"+(e%60).toFixed(3).padStart(6,"0")}document.getElementById("result").innerHTML="Down: "+u(l)+"<br>Normal: "+u(r)+"<br>Up: "+u(n)}</script>
