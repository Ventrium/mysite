<!doctypehtml><title>Multiple ILs Time Calculator</title><h1>Multiple ILs Time Calculator</h1><div id=times><input type=number step=any></div><br><button onclick=add()>Add</button><br><br><label>FPS: <input type=number id=fps min=1 value=240></label><br><br><label>Rounding: <select id=rounding><option value=down>Down<option value=normal>Normal<option value=up>Up</select></label><br><br><button onclick=calculate()>Calculate</button><p id=result></p><script>function add(){let e=document.createElement("input");e.type="number",e.step="any";let t=document.getElementById("times");t.appendChild(document.createElement("br")),t.appendChild(e)}function calculate(){let t=Number(document.getElementById("fps").value),e=[...document.querySelectorAll("#times input")].map(e=>Number(e.value)).filter(e=>!isNaN(e));var n,l=e.map(e=>Math.round(e*t)/t).reduce((e,t)=>e+t,0),u=document.getElementById("rounding").value;let a;"down"===u&&(a=Math.floor(1e3*l)/1e3),"normal"===u&&(a=Math.round(1e3*l)/1e3),"up"===u&&(a=(.498<=1e3*l%1?Math.ceil(1e3*l):Math.floor(1e3*l))/1e3),document.getElementById("result").textContent=(n=a,Math.floor(n/60)+":"+(n%60).toFixed(3).padStart(6,"0"))}</script>
