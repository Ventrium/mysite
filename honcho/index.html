<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Honcho Calculator</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap"><style>body{text-align:center;background:#111 url(/archive.png) center/cover fixed;color:#fff;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif}button{font-family:inherit;background:#333;color:#fff;border:1px solid #777}button.on{background:#fff;color:#111}th,td{text-align:center;padding:4px 12px}table{margin:0 auto}</style><main><h1>Honcho Calculator</h1><p class="s">Prioritises 5 sectors then the least gold.<div class="card"><div><b>Sector 2:</b></div><div class="row"><button data-m="C">C [Billerd]</button><button data-m="D">D [Noob]</button><button data-m="E">E [Greuce]</button><button data-m="Any" class="on">Any</button></div><div style="margin-top:8px"><b>Honcho:</b></div><div id="hon"></div><p class="note" style="margin:8px 0 0">(The Sector 2 option limits searches based on the reasonable sector a player can jump to) Any lets the calculator pick the best Sector 2. Honcho can spawn from the sector after Sector 2 up to Z.</div><div id="out"></div><script>var COST=[0,100,225,381,576,800,1105,1486],L=function(t){return String.fromCharCode(65+t)},mode="Any";function seg(t,n){var o,r,e,l=n-t,a=[],c=[];for(o=0;o<=n;o++)a.push(Array(l+1).fill(1/0)),c.push(Array(l+1).fill(-1));for(a[t][0]=0,r=1;r<=l;r++)for(o=t+1;o<=n;o++)for(e=0;e<8;e++){var i=o-e-1;if(i<t)break;var s=a[i][r-1]+COST[e];s<a[o][r]&&(a[o][r]=s,c[o][r]=i)}return{c:a,p:c,b:n}}function path(t,n){for(var o=[t.b],r=t.b;n>0;)r=t.p[r][n],o.push(r),n--;return o.reverse()}function better(t,n,o){return!o||n<o.n||n===o.n&&t<o.v}function solve(t,n){var o,r,e,l,a=null;if(null===n||25===n){for(o=seg(t,25),e=1;e<=25-t;e++){var c=o.c[25][e];c<1/0&&better(c,e,a)&&(a={v:c,n:e,p:path(o,e)})}return a?fin(t,a.p,a.n):null}for(o=seg(t,n),r=seg(n,25),e=1;e<=n-t;e++)for(l=1;l<=25-n;l++){var i=o.c[n][e]+r.c[25][l];i<1/0&&better(i,e+l,a)&&(a={v:i,n:e+l,a:e,b:l})}return a?fin(t,path(o,a.a).concat(path(r,a.b).slice(1)),a.n):null}function fin(t,n,o){for(var r=[0].concat(n),e=0,l=[],a=1;a<r.length;a++){var c=r[a]-r[a-1]-1,i=COST[c];e+=i,l.push({f:r[a-1],t:r[a],k:c,c:i})}return{gold:e,stops:r.length,route:r,jumps:l,s2:t}}function pick(t){var n=null;return("Any"===mode?[1,2,3,4,5,6,7,8]:["C"===mode?2:"D"===mode?3:4]).forEach(function(o){if(!(o>8||null!==t&&t<=o)){var r=solve(o,t);r&&(!n||r.stops<n.stops||r.stops===n.stops&&r.gold<n.gold)&&(n=r)}}),n}function rs(t,n){return t.map(function(t){return t===n?'<span class="h">'+L(t)+"</span>":L(t)}).join("")}function lo(){return"Any"===mode?2:"C"===mode?3:"D"===mode?4:5}var hon=25;function fillSel(){hon<lo()&&(hon=25);for(var t="",n=lo();n<=25;n++)2!==n&&3!==n&&(t+='<button data-h="'+n+'"'+(n===hon?' class="on"':"")+">"+L(n)+"</button> ");var o=document.getElementById("hon");o.innerHTML=t,o.querySelectorAll("button").forEach(function(t){t.onclick=function(){hon=+t.dataset.h,fillSel(),render()}})}function render(){var t=hon,n=pick(t),o=document.getElementById("out");if(n){var r='<div class="card"><p class="note" style="margin:0 0 6px">'+n.stops+" sectors · Sector 2 = "+L(n.s2)+" · Honcho at "+L(t)+'</p><div class="big">The '+rs(n.route,t)+' (<span style="color:#ff0">'+n.gold.toLocaleString()+'</span> <img src="/gold.png" alt="Gold" style="height:1em;vertical-align:-.15em">)</div><table style="margin-top:8px"><tr><th>Jump</th><th>Skips</th><th><img src="/gold.png" alt="Gold" style="height:1em;vertical-align:-.15em"></th></tr>';n.jumps.forEach(function(t){r+="<tr><td>"+L(t.f)+" → "+L(t.t)+'</td><td style="color:'+(1===t.k||2===t.k||7===t.k?"#ff0000":5===t.k||6===t.k?"#00ff00":3===t.k||4===t.k?"#ff8000":"#fff")+'">'+t.k+'</td><td><span style="color:#ff0">'+t.c.toLocaleString()+'</span> <img src="/gold.png" alt="Gold" style="height:1em;vertical-align:-.15em"></td></tr>'}),r+="</table></div>",o.innerHTML=r}else o.innerHTML='<div class="card">No valid route.</div>'}document.querySelectorAll("button[data-m]").forEach(function(t){t.onclick=function(){mode=t.dataset.m,document.querySelectorAll("button[data-m]").forEach(function(n){n.classList.toggle("on",n===t)}),fillSel(),render()}}),fillSel(),render()</script></main>
